<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h3 id="page-header">My Library</h3>
        <button id="add-btn">Add Book</button>
    </header>
    <main>
        <div id="library-container"></div>
        <dialog id="addBookModal">
            <form id="book-form">
                <label>
                    Title:
                    <input id="title" type="text" placeholder="The Count of Monte Cristo" required>
                </label>
                <label>
                    Author:
                    <input id="author" type="text" placeholder="Alexandre Dumas" required>
                </label>
                <label>
                    Pages:
                    <input id="pages" type="number" placeholder="1312" min="1" required>
                </label>
                <label>
                    Read:
                    <input type="checkbox" id="read">
                </label>
                <button type="submit" id="submit">Add Book</button>
                <button id="cancel">Cancel</button>
            </form>
        </dialog>
    </main>
    <script src="app.js" defer></script>
</body>
</html>
